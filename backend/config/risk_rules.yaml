#   high      17 条
#   medium     5 条
#   low        1 条（提示性）
#
# 【高风险规则（critical）清单】
#   SUBJ-001 主体异常 | BAL-001 单方无限连带责任 | BAL-002 单方免责
#   JUR-001 管辖违规 | PAY-001 无验收即全款支付 | CORE-001 缺失违约责任
#   PUR-001 缺失交付验收 | PUR-002 缺失质量保证 | LAB-001 缺失劳动报酬
#   LAB-002 缺失社会保险 | LAB-005 劳动条款侵害权益
