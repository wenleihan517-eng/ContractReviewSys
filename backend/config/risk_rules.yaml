#   │   BAL-001 单方无限连带责任（critical，主体异常高危）
#   │   BAL-002 单方免责表述（critical）
#   │   BAL-003 单方变更权
#   │   BAL-004 赔偿责任不对等（单向赔偿义务）
#   │   BAL-005 赔偿责任上限显著不对等
#   │   BAL-006 单方任意解除权
