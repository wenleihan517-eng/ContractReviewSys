# D:/ContractReviewSys-合同审批智能审查项目/deploy/docker/docker-compose.yml
# =====================================================================
# 本地开发依赖编排
# 说明：
#   1. MongoDB / MinIO 为本地容器部署
#   2. Milvus 复用现有实例 192.168.10.130:7000，故此处不编排 Milvus
#   3. 如需本地起 Milvus 做联调，可解开文件末尾被注释的服务定义
# 使用：
#   cd deploy/docker && docker-compose up -d
# =====================================================================
version: "3.8"

services:
  # ------------------------------------------------------------------
  # MongoDB — 业务主数据存储
  # ------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: cr-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      # 开发环境不开启鉴权，生产环境务必配置账号密码
      MONGO_INITDB_DATABASE: contract_review
    volumes:
      - ../../storage/mongo_data:/data/db
    healthcheck:
      # 健康检查：每 10 秒探测一次
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------
  # MinIO — 对象存储（合同原文 / OCR 图片 / 报告）
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: cr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"    # S3 API 端口
      - "9001:9001"    # 控制台端口
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ../../storage/minio_data:/data
    healthcheck:
      # 健康检查：探测 MinIO 存活接口
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------
  # 说明：MinIO 存储桶由后端启动时自动创建（见 app/storage/minio_client.py）
  #       MongoDB 库 / 集合 / 索引由 backend/scripts/init_mongodb.py 初始化，
  #       或直接执行 deploy/scripts/init_all.py 一键完成全部初始化。
  # ------------------------------------------------------------------

  # ------------------------------------------------------------------
  # TEI — BGE-M3 本地向量化服务（OpenAI 兼容 /v1/embeddings）
  # ------------------------------------------------------------------
  # 重要：模型权重直接挂载本机已有缓存 D:/ai_model/BAAI/bge-m3（2.2GB，完整），
  #       无需联网下载。若该目录不存在才需首次联网拉取。
  # 关键参数说明：
  #   --dtype float16   CPU 环境下大幅降低内存占用（本机 Docker 内存约 5.8GB，
  #                     默认 fp32 会在 warmup 阶段被 OOM 杀掉并无限重启）
  #   --auto-truncate   允许 --max-batch-tokens 小于模型 max_input_length(8192)
  #   HF_HUB_OFFLINE=1  强制离线，避免误触发联网下载
  # 注意：bge-m3 缓存目录内如残留 onnx/model.onnx_data.incomplete，
  #       会导致 ORT 后端报错（不影响 Candle 回退，但会刷错误日志），
  #       建议将残缺的 onnx 目录移走。
  # ------------------------------------------------------------------
  tei-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: cr-tei
    restart: unless-stopped
    ports:
      - "9997:80"
    volumes:
      - D:/ai_model/BAAI/bge-m3:/data
    environment:
      HF_HUB_OFFLINE: "1"
    command: ["--model-id", "/data", "--port", "80", "--dtype", "float16", "--auto-truncate", "--max-batch-tokens", "2048"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

