# D:/MY-product/ContractReviewSys/deploy/docker/docker-compose.yml
# =====================================================================
# 本地开发依赖编排（统一版 · 2026-10-19 迁移改造）
# 说明：
#   1. MongoDB / MinIO / etcd / Milvus / TEI 五件套全部收编进本文件统一管理，
#      数据卷统一挂载到 <项目根>/storage/ 下，数据跟随项目走。
#   2. 镜像版本与端口映射逐项照抄自迁移前手工创建的运行容器
#      （docker inspect 实测值），与 backend/.env 的连接配置严格对齐：
#        - mongo:7.0                     → 27017
#        - minio RELEASE.2024-05-28      → 9000(API) / 9001(控制台)
#        - etcd v3.5.18                  → 不映射端口（容器间内网访问）
#        - milvus v2.5.27 standalone     → 19531(宿主)→19530(gRPC)
#                                          9092(宿主)→9091(metrics)
#        - tei cpu-1.8                   → 9997(宿主)→80(容器)
#   3. Milvus 通过 host.docker.internal:9000 访问 MinIO（迁移前即如此），
#      通过服务名 cr-etcd:2379 访问 etcd（同 compose 网络内容器名可解析，
#      等价于原先的 --link 方案）。
#   4. TEI 模型权重挂载本机已有缓存 D:/ai_model/BAAI/bge-m3（离线，
#      HF_HUB_OFFLINE=1），float16 + max-batch-tokens 2048 为实测防 OOM 参数。
# 使用：
#   docker compose up -d            # 启动全部
#   docker compose stop milvus      # 停单个服务
#   docker compose logs -f milvus   # 看日志
#   docker compose ps               # 状态总览
# =====================================================================

# compose 项目名：决定 Docker Desktop 中的分组显示名。
# 不指定时默认取所在文件夹名（docker），会与其他项目的容器混排；
# 显式命名为 contract-review，在 Docker Desktop 中独立成组。
name: contract-review

services:
  # ------------------------------------------------------------------
  # MongoDB — 业务主数据存储
  # ------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: cr-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      # 开发环境不开启鉴权，生产环境务必配置账号密码
      MONGO_INITDB_DATABASE: contract_review
    volumes:
      - ../../storage/mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------
  # MinIO — 对象存储（合同原文 / OCR 图片 / 报告 / Milvus 后端存储）
  # 注意：镜像为迁移时运行容器实际使用的 2024-05-28 版本
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: cr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"    # S3 API 端口
      - "9001:9001"    # 控制台端口
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ../../storage/minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------
  # etcd — Milvus 元数据存储（不对外映射端口，仅容器网络内访问）
  # ------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: cr-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://0.0.0.0:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ../../storage/etcd_data:/etcd

  # ------------------------------------------------------------------
  # Milvus — 向量库 standalone
  # 端口映射保持迁移前的 19531 / 9092（backend/.env 的 MILVUS_PORT=19531）
  # ------------------------------------------------------------------
  milvus:
    image: milvusdb/milvus:v2.5.27
    container_name: cr-milvus
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: cr-etcd:2379
      MINIO_ADDRESS: host.docker.internal:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_BUCKET_NAME: milvus-local
      COMMON_STORAGETYPE: minio
    ports:
      - "19531:19530"   # gRPC（宿主端口沿用迁移前的 19531）
      - "9092:9091"     # metrics
    volumes:
      - ../../storage/milvus_data:/var/lib/milvus
    extra_hosts:
      # 确保 host.docker.internal 可解析（指向宿主机）
      - "host.docker.internal:host-gateway"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # ------------------------------------------------------------------
  # TEI — BGE-M3 本地向量化服务（OpenAI 兼容 /v1/embeddings）
  # 模型权重挂载本机已有缓存 D:/ai_model/BAAI/bge-m3，无需联网下载。
  # dtype=float16 + max-batch-tokens=2048：CPU 环境防 OOM 实测参数。
  # ------------------------------------------------------------------
  tei-embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: cr-tei
    restart: unless-stopped
    ports:
      - "9997:80"
    volumes:
      - D:/ai_model/BAAI/bge-m3:/data
    environment:
      HF_HUB_OFFLINE: "1"
    command: ["--model-id", "/data", "--port", "80", "--dtype", "float16", "--auto-truncate", "--max-batch-tokens", "2048"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
